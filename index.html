<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>닷컴ONLY·타임딜</title>
<style>
:root{--bg:#fff;--tx:#1d1d1f;--mu:#777;--ln:#e6e6e6;--rd:#c8102e}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--tx:#f2f2f2;--mu:#999;--ln:#2e2e2e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#lock{max-width:320px;margin:30vh auto;padding:0 20px;text-align:center}
input,button{font:inherit;padding:11px 14px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);width:100%;margin-top:10px}
button{background:var(--rd);color:#fff;border:0;font-weight:600}
#app{display:none}header{padding:14px 16px 0;position:sticky;top:0;background:var(--bg)}
h1{font-size:17px;margin:0 0 4px}#meta{color:var(--mu);font-size:12px}
#tabs,#stabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--ln)}
#tabs b,#stabs b{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--ln);font-weight:500;cursor:pointer}
#tabs b.on,#stabs b.on{background:var(--tx);color:var(--bg)}
a.it{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--ln);color:inherit;text-decoration:none;align-items:center}
.it img{width:84px;height:84px;object-fit:contain;flex:none;background:#fff;border-radius:6px}
.md{font-size:12px;color:var(--mu)}.nm{font-size:14px}.pr{font-size:18px;font-weight:700;margin-top:2px}.tg{font-size:11px;color:var(--rd);font-weight:600}
#adm{display:none;margin:10px 16px;padding:10px;border:1px dashed var(--ln);border-radius:8px;font-size:12px;color:var(--mu)}
</style></head><body>
<div id="lock"><h1>베스트샵 전용</h1><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"><button onclick="login()">입장</button><div id="err" style="color:var(--rd);margin-top:8px"></div></div>
<div id="app"><header><h1>닷컴ONLY · 타임딜</h1><div id="meta"></div><div id="tabs"></div><div id="stabs"></div></header><div id="adm"></div><div id="list"></div></div>
<script>
const H={user:"a801a48d41d5b8e2e4861c9afdafab333f508f7a7e7533b5986a592fc1e8ea7b",admin:"0130aaadb65a075fe0f67ed79caf6886e0e45580a74a56c72f469a17c85fd502"};
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("lgbs:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function login(){const h=await sha(document.getElementById("pw").value);const r=h===H.admin?"admin":h===H.user?"user":null;
if(!r){err.textContent="비밀번호가 맞지 않아요";return}sessionStorage.r=r;sessionStorage.h=h;start()}
document.getElementById("pw").addEventListener("keydown",e=>e.key=="Enter"&&login());
let D,cur="전체",sb="전체";
async function start(){if(!sessionStorage.r)return;lock.style.display="none";app.style.display="block";
D=await (await fetch("data.json?"+Date.now())).json();
meta.textContent="최근 갱신 "+(D.updated||"-")+" · 총 "+D.items.length+"개";
if(sessionStorage.r=="admin"){adm.style.display="block";const s=D.status||{};adm.innerHTML="관리자 · 타임딜 "+(s.timedeal||0)+"개 / 닷컴ONLY "+(s.only||0)+"개"+(s.errors&&s.errors.length?"<br>확인 필요: "+s.errors.join(", "):"")}
draw()}
function draw(){const T=D.items.filter(i=>i.tags.includes("타임딜"));
const cats=["전체","타임딜",...new Set(D.items.map(i=>i.cat))];
const base=cur=="전체"?D.items:cur=="타임딜"?T:D.items.filter(i=>i.cat==cur);
let subs=[];if(cur=="타임딜")subs=[...new Set(T.map(i=>i.cat))];
else if(cur!="전체"){const m=new Map();base.forEach(i=>i.sub&&m.set(i.sub,i.subn||0));subs=[...m].sort((a,b)=>a[1]-b[1]).map(e=>e[0])}
if(sb!="전체"&&!subs.includes(sb))sb="전체";
const f=base.filter(i=>sb=="전체"||(cur=="타임딜"?i.cat:i.sub)==sb).sort((a,b)=>(a.cat>b.cat?1:a.cat<b.cat?-1:0)||(a.subn||0)-(b.subn||0)||a.price-b.price);
tabs.innerHTML=cats.map(c=>'<b class="'+(c==cur?"on":"")+'" onclick="cur=\''+c+'\';sb=\'전체\';draw()">'+c+"</b>").join("");
stabs.innerHTML=subs.length?["전체",...subs].map(c=>'<b class="'+(c==sb?"on":"")+'" onclick="sb=\''+c+'\';draw()">'+c+"</b>").join(""):"";
stabs.style.display=subs.length?"flex":"none";
list.innerHTML=f.map(i=>'<a class="it" href="'+i.url+'" target="_blank" rel="noopener"><img src="'+i.img+'" alt="" loading="lazy"><div><div class="tg">'+i.tags.join(" · ")+'</div><div class="nm">'+i.name+'</div><div class="md">'+(i.model||"")+'</div><div class="pr">'+i.price.toLocaleString()+'원</div></div></a>').join("")||'<p style="padding:20px;color:var(--mu)">해당하는 제품이 없어요.</p>'}
start()
</script></body></html>
